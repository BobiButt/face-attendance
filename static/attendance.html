<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — Face Attendance</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%);
      color: #e2e8f0; min-height: 100vh; padding: 20px;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 900px; }

    .nav {
      display: flex; gap: 10px; margin-bottom: 24px;
      justify-content: center; flex-wrap: wrap;
    }
    .nav a {
      color: #94a3b8; text-decoration: none;
      padding: 8px 16px; border-radius: 8px;
      background: #1e293b; font-size: 0.9rem;
      transition: 0.2s; border: 1px solid transparent;
    }
    .nav a:hover { background: #334155; color: #e2e8f0; }
    .nav a.active {
      background: #38bdf8; color: #0f172a; font-weight: 600;
      border-color: #38bdf8;
    }

    h1 {
      text-align: center; margin-bottom: 20px;
      font-size: 1.8rem; color: #38bdf8;
    }

    .card {
      background: #1e293b; border-radius: 12px; padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; gap: 12px; flex-wrap: wrap;
    }
    .topbar-left {
      display: flex; align-items: center; gap: 12px;
    }
    .count-pill {
      background: #0f172a; padding: 6px 14px;
      border-radius: 20px; font-size: 0.85rem;
      color: #94a3b8; font-weight: 600;
    }

    .topbar-right { display: flex; gap: 8px; }

    button {
      padding: 8px 16px; border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 0.85rem;
      transition: 0.2s;
    }
    .btn-refresh { background: #38bdf8; color: #0f172a; }
    .btn-refresh:hover { background: #0ea5e9; }
    .btn-export { background: #4ade80; color: #0f172a; }
    .btn-export:hover { background: #22c55e; }

    /* Auto-refresh toggle */
    .toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.85rem; color: #94a3b8; cursor: pointer;
    }
    .toggle input { accent-color: #38bdf8; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid #334155; font-size: 0.9rem;
    }
    th {
      color: #38bdf8; font-weight: 600;
      text-transform: uppercase; font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    tr:hover { background: #0f172a; }

    .row-new {
      animation: highlight 2s ease;
    }
    @keyframes highlight {
      0%   { background: rgba(74, 222, 128, 0.3); }
      100% { background: transparent; }
    }

    .empty {
      text-align: center; padding: 30px; color: #64748b;
    }

    .badge-id {
      background: #0f172a; color: #38bdf8;
      padding: 2px 8px; border-radius: 4px;
      font-size: 0.8rem; font-weight: 700;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📋 Attendance History</h1>

    <div class="nav">
      <a href="/ui/home.html">🏠 Home</a>
      <a href="/ui/index.html">📝 Register</a>
      <a href="/ui/recognize.html">🎥 Recognize</a>
      <a href="/ui/attendance.html" class="active">📋 Attendance</a>
      <a href="/docs" target="_blank">📚 API Docs</a>
    </div>

    <div class="card">
      <div class="topbar">
        <div class="topbar-left">
          <span class="count-pill" id="count">Loading...</span>
          <label class="toggle">
            <input type="checkbox" id="autoRefresh" checked />
            Auto-refresh (5s)
          </label>
        </div>
        <div class="topbar-right">
          <button class="btn-export" onclick="exportCSV()">⬇ CSV</button>
          <button class="btn-refresh" onclick="loadAttendance()">🔄 Refresh</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>User ID</th>
            <th>Name</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div id="empty" class="empty" style="display:none;">
        No attendance records yet. Go to the Recognize page and show your face!
      </div>
    </div>
  </div>

  <script>
    let currentData = [];         // cache last loaded data (for CSV export)
    let refreshInterval = null;
    let lastTopId = null;

    async function loadAttendance() {
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      const count = document.getElementById('count');

      try {
        const res  = await fetch('/attendance');
        const data = await res.json();

        currentData = data;
        count.textContent = `${data.length} record${data.length !== 1 ? 's' : ''}`;

        if (data.length === 0) {
          tbody.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        tbody.innerHTML = '';

        // Highlight newest row (first in list since sorted desc)
        const newestId = data[0]?.id;

        for (const row of data) {
          const tr = document.createElement('tr');
          if (row.id === newestId && row.id !== lastTopId) {
            tr.classList.add('row-new');
          }
          tr.innerHTML = `
            <td><span class="badge-id">#${row.id}</span></td>
            <td>${row.user_id}</td>
            <td><b>${row.name}</b></td>
            <td>${new Date(row.timestamp).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        }
        lastTopId = newestId;
      } catch (err) {
        count.textContent = 'Error loading';
        console.error(err);
      }
    }

    function exportCSV() {
      if (currentData.length === 0) {
        alert('No data to export');
        return;
      }
      const header = 'ID,User ID,Name,Timestamp\n';
      const rows = currentData.map(r =>
        `${r.id},${r.user_id},"${r.name.replace(/"/g, '""')}",${r.timestamp}`
      ).join('\n');

      const blob = new Blob([header + rows], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `attendance_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Auto-refresh toggle
    const autoToggle = document.getElementById('autoRefresh');
    function setAutoRefresh(on) {
      if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
      if (on) refreshInterval = setInterval(loadAttendance, 5000);
    }
    autoToggle.addEventListener('change', e => setAutoRefresh(e.target.checked));

    loadAttendance();
    setAutoRefresh(true);
  </script>
</body>
</html>
